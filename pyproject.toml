[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "price-monitor"
version = "0.1.6"
requires-python = ">=3.11"
dependencies = [
    # Private repos, so SSH rather than HTTPS: the installing host needs a key
    # with read access to all three. Pinned to tags, never a branch — an
    # unpinned dependency means a redeploy can ship code no test has seen.
    "py-utils @ git+ssh://git@github.com/williamvda/py-utils.git@v0.1.4",
    "google-drive-api @ git+ssh://git@github.com/williamvda/google-drive-api.git@v0.1.5",
    "llmbridge @ git+ssh://git@github.com/williamvda/AIInterface.git@v0.1.0",
    "pandas",
    "python-dotenv",
]

[project.scripts]
price-monitor = "price_monitor.price_monitor:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "black>=24.0", "isort>=5.13", "flake8>=7.0"]
# msgserver is a direct git reference rather than a plain name: it is not
# published on PyPI. Only needed when running with --msg-server.
msgserver = ["msgserver @ git+ssh://git@github.com/williamvda/MsgServer.git@v0.1.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v -m 'not integration'"
markers = [
    "integration: live tests against external APIs (run with -m integration)",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88
